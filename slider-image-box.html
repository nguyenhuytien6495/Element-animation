<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Stories Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a4d5e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 576px;
            height: auto;
            aspect-ratio: 1 / 1;
        }

        .slide-box {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            background: white;
        }

        .slide-box-image {
            position: absolute;
            left: 0;
            top: 0;

            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .slide-box-image.active {
            opacity: 1;
        }

        .slide-box-content {
            position: absolute;
            left: 12px;
            bottom: 12px;
            width: 360px;
            max-width: 100%;

            background: white;
            padding: 12px;
            border-radius: 8px;
        }

        .box-logo {
            max-width: 100%;
            max-height: 100%;
            height: 35px;

            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .box-logo.active {
            opacity: 1;
        }

        .box-title {
            font-size: 16px;
            line-height: 1.5;
            color: #1F2643;
            height: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-line-clamp: 3;
            display: -webkit-box;
            -webkit-box-orient: vertical;

            margin-top: 10px;
            margin-bottom: 0;

            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .box-title.active {
            opacity: 1;
        }

        .box-link {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;

            color: #2575F0;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;

            opacity: 0;
            transition: opacity 0.6s ease-in-out, gap 0.3s ease;
        }

        .box-link.active {
            opacity: 1;
        }

        .progress-bars {
            width: 100px;
            display: flex;
            gap: 4px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: #D9D9D9;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #1F2643;
            width: 0%;
            transition: none;
        }

        .progress-bar.completed .progress-fill {
            width: 100% !important;
            transition: none !important;
        }

        .progress-bar.animating .progress-fill {
            width: 100% !important;
            transition: width 3s linear !important;
        }

        /* Hide slide data */
        .slides-data {
            display: none;
        }
    </style>
</head>

<body>
    <div class="slider-wrapper">
        <!-- Slide Box - Display Area -->
        <div class="slide-box">
            <!-- Images will be injected here -->
            <div class="slide-box-images"></div>

            <!-- Content Area -->
            <div class="slide-box-content">
                <div class="progress-bars">
                    <!-- Progress bars will be generated by JS -->
                </div>
                <img class="box-logo" src="" alt="Brand Logo">
                <p class="box-title"></p>
                <a href="#" class="box-link">Read more <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 20 20" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M2.77734 10.0001C2.77734 9.53982 3.15044 9.16672 3.61068 9.16672L14.3769 9.16672L11.3548 6.1449C11.0293 5.81948 11.0293 5.29184 11.3547 4.96638C11.6801 4.64093 12.2078 4.6409 12.5332 4.96633L16.9781 9.41077C17.1344 9.56705 17.2222 9.77903 17.2222 10.0001C17.2222 10.2211 17.1344 10.4331 16.9781 10.5893L12.5332 15.0338C12.2078 15.3592 11.6801 15.3592 11.3547 15.0337C11.0293 14.7083 11.0293 14.1806 11.3548 13.8552L14.3769 10.8334L3.61068 10.8334C3.15044 10.8334 2.77734 10.4603 2.77734 10.0001Z"
                            fill="#2575F0" />
                    </svg></a>
            </div>
        </div>

        <!-- Slides Data - Hidden -->
        <div class="slides-data">
            <div class="slide-item" data-index="0">
                <img class="slide-image"
                    src="https://aov.ai/wp-content/uploads/2025/10/1166916357-Service-Description-Pages_ProCalm_Service.jpg"
                    alt="Dermalogica">
                <img class="slide-logo" src="https://aov.ai/wp-content/uploads/2025/11/Dermalogica-logo.png"
                    alt="Dermalogica Logo">
                <div class="slide-title">The Gift That Keeps Giving: Inoki's Tiered Reward Strategy Case Study</div>
                <div class="slide-link">#</div>
            </div>

            <div class="slide-item" data-index="1">
                <img class="slide-image"
                    src="https://aov.ai/wp-content/uploads/2025/10/1166916357-Service-Description-Pages_ProCalm_Service.jpg"
                    alt="Glossier">
                <img class="slide-logo" src="https://aov.ai/wp-content/uploads/2025/11/Dermalogica-logo.png"
                    alt="Glossier Logo">
                <div class="slide-title">How Glossier Increased Customer Lifetime Value by 45% with Personalized Rewards
                </div>
                <div class="slide-link">#</div>
            </div>

            <div class="slide-item" data-index="2">
                <img class="slide-image" src="https://aov.ai/wp-content/uploads/2025/08/SUMMER-BLISS_56.webp"
                    alt="Everlane">
                <img class="slide-logo" src="https://aov.ai/wp-content/uploads/2025/11/Dermalogica-logo.png"
                    alt="Everlane Logo">
                <div class="slide-title">Sustainable Fashion Meets Customer Loyalty: Everlane's Success Story</div>
                <div class="slide-link">#</div>
            </div>
        </div>
    </div>

    <script>
        // Get elements
        const slideItems = document.querySelectorAll('.slide-item');
        const slideBoxImages = document.querySelector('.slide-box-images');
        const boxLogo = document.querySelector('.box-logo');
        const boxTitle = document.querySelector('.box-title');
        const boxLink = document.querySelector('.box-link');
        const progressBarsContainer = document.querySelector('.progress-bars');

        let currentSlide = 0;
        let slideInterval;
        let imageElements = [];

        // Initialize slider
        function initSlider() {
            // Create image elements in slide-box
            slideItems.forEach((item, index) => {
                const img = item.querySelector('.slide-image').cloneNode(true);
                img.classList.add('slide-box-image');
                if (index === 0) img.classList.add('active');
                slideBoxImages.appendChild(img);
                imageElements.push(img);
            });

            // Create progress bars
            slideItems.forEach((item, index) => {
                const progressBar = document.createElement('div');
                progressBar.classList.add('progress-bar');
                progressBar.setAttribute('data-index', index);
                progressBar.innerHTML = '<div class="progress-fill"></div>';
                progressBar.addEventListener('click', () => goToSlide(index));
                progressBarsContainer.appendChild(progressBar);
            });

            // Load first slide data immediately (without animation delay)
            const firstSlideItem = slideItems[0];
            const firstLogoSrc = firstSlideItem.querySelector('.slide-logo').src;
            const firstLogoAlt = firstSlideItem.querySelector('.slide-logo').alt;
            const firstTitle = firstSlideItem.querySelector('.slide-title').textContent;
            const firstLink = firstSlideItem.querySelector('.slide-link').textContent;

            boxLogo.src = firstLogoSrc;
            boxLogo.alt = firstLogoAlt;
            boxTitle.textContent = firstTitle;
            boxLink.href = firstLink;

            // Activate content
            boxLogo.classList.add('active');
            boxTitle.classList.add('active');
            boxLink.classList.add('active');

            // Start progress animation for first slide
            const firstProgressBar = document.querySelector('.progress-bar[data-index="0"]');
            setTimeout(() => {
                firstProgressBar.classList.add('animating');
            }, 100);

            // Start auto-play
            startAutoPlay();
        }

        function loadSlideData(index) {
            const slideItem = slideItems[index];
            const logoSrc = slideItem.querySelector('.slide-logo').src;
            const logoAlt = slideItem.querySelector('.slide-logo').alt;
            const title = slideItem.querySelector('.slide-title').textContent;
            const link = slideItem.querySelector('.slide-link').textContent;

            // Fade out current content
            boxLogo.classList.remove('active');
            boxTitle.classList.remove('active');
            boxLink.classList.remove('active');

            // Update content after fade out
            setTimeout(() => {
                boxLogo.src = logoSrc;
                boxLogo.alt = logoAlt;
                boxTitle.textContent = title;
                boxLink.href = link;

                // Fade in new content
                setTimeout(() => {
                    boxLogo.classList.add('active');
                    boxTitle.classList.add('active');
                    boxLink.classList.add('active');
                }, 50);
            }, 300);
        }

        function goToSlide(index) {
            // Clear existing interval
            clearInterval(slideInterval);

            // Update images
            imageElements.forEach((img, i) => {
                img.classList.remove('active');
                if (i === index) {
                    img.classList.add('active');
                }
            });

            // Load slide data into box (skip on first init)
            if (currentSlide !== index || currentSlide !== 0) {
                loadSlideData(index);
            }

            // Update progress bars
            const progressBars = document.querySelectorAll('.progress-bar');
            progressBars.forEach((bar, i) => {
                bar.classList.remove('animating', 'completed');
                if (i < index) {
                    bar.classList.add('completed');
                }
            });

            // Animate current progress bar
            setTimeout(() => {
                progressBars[index].classList.add('animating');
            }, 100);

            // Update current slide
            currentSlide = index;

            // Start auto-play
            startAutoPlay();
        }

        function nextSlide() {
            const nextIndex = (currentSlide + 1) % slideItems.length;
            goToSlide(nextIndex);
        }

        function startAutoPlay() {
            slideInterval = setTimeout(() => {
                nextSlide();
            }, 3000);
        }

        // Initialize on load
        initSlider();
    </script>
</body>

</html>
