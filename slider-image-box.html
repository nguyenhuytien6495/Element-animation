<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Stories Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a4d5e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 500px;
        }

        .slide-box {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            background: white;
        }

        .slide-box-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .slide-box-image.active {
            opacity: 1;
        }

        .slide-box-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 28px 24px 24px;
            border-radius: 20px 20px 24px 24px;
        }

        .box-logo {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .box-logo.active {
            opacity: 1;
        }

        .box-title {
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 16px;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .box-title.active {
            opacity: 1;
        }

        .box-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.6s ease-in-out, gap 0.3s ease;
        }

        .box-link.active {
            opacity: 1;
        }

        .box-link:hover {
            gap: 12px;
        }

        .box-link::after {
            content: '→';
            font-size: 16px;
        }

        .progress-bars {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .progress-bar {
            flex: 1;
            height: 3px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #1f2937;
            width: 0%;
            transition: none;
        }

        .progress-bar.completed .progress-fill {
            width: 100% !important;
            transition: none !important;
        }

        .progress-bar.animating .progress-fill {
            width: 100% !important;
            transition: width 3s linear !important;
        }

        /* Hide slide data */
        .slides-data {
            display: none;
        }
    </style>
</head>
<body>
    <div class="slider-wrapper">
        <!-- Slide Box - Display Area -->
        <div class="slide-box">
            <!-- Images will be injected here -->
            <div class="slide-box-images"></div>
            
            <!-- Content Area -->
            <div class="slide-box-content">
                <div class="box-logo"></div>
                <p class="box-title"></p>
                <a href="#" class="box-link">Read more</a>
                <div class="progress-bars">
                    <!-- Progress bars will be generated by JS -->
                </div>
            </div>
        </div>

        <!-- Slides Data - Hidden -->
        <div class="slides-data">
            <div class="slide-item" data-index="0">
                <img class="slide-image" src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500&h=600&fit=crop" alt="Dermalogica">
                <div class="slide-logo">dermalogica</div>
                <div class="slide-title">The Gift That Keeps Giving: Inoki's Tiered Reward Strategy Case Study</div>
                <div class="slide-link">#</div>
            </div>

            <div class="slide-item" data-index="1">
                <img class="slide-image" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&h=600&fit=crop" alt="Glossier">
                <div class="slide-logo">glossier</div>
                <div class="slide-title">How Glossier Increased Customer Lifetime Value by 45% with Personalized Rewards</div>
                <div class="slide-link">#</div>
            </div>

            <div class="slide-item" data-index="2">
                <img class="slide-image" src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=500&h=600&fit=crop" alt="Everlane">
                <div class="slide-logo">EVERLANE</div>
                <div class="slide-title">Sustainable Fashion Meets Customer Loyalty: Everlane's Success Story</div>
                <div class="slide-link">#</div>
            </div>
        </div>
    </div>

    <script>
        // Get elements
        const slideItems = document.querySelectorAll('.slide-item');
        const slideBoxImages = document.querySelector('.slide-box-images');
        const boxLogo = document.querySelector('.box-logo');
        const boxTitle = document.querySelector('.box-title');
        const boxLink = document.querySelector('.box-link');
        const progressBarsContainer = document.querySelector('.progress-bars');

        let currentSlide = 0;
        let slideInterval;
        let imageElements = [];

        // Initialize slider
        function initSlider() {
            // Create image elements in slide-box
            slideItems.forEach((item, index) => {
                const img = item.querySelector('.slide-image').cloneNode(true);
                img.classList.add('slide-box-image');
                if (index === 0) img.classList.add('active');
                slideBoxImages.appendChild(img);
                imageElements.push(img);
            });

            // Create progress bars
            slideItems.forEach((item, index) => {
                const progressBar = document.createElement('div');
                progressBar.classList.add('progress-bar');
                progressBar.setAttribute('data-index', index);
                progressBar.innerHTML = '<div class="progress-fill"></div>';
                progressBar.addEventListener('click', () => goToSlide(index));
                progressBarsContainer.appendChild(progressBar);
            });

            // Load first slide
            goToSlide(0);
        }

        function loadSlideData(index) {
            const slideItem = slideItems[index];
            const logo = slideItem.querySelector('.slide-logo').textContent;
            const title = slideItem.querySelector('.slide-title').textContent;
            const link = slideItem.querySelector('.slide-link').textContent;

            // Fade out current content
            boxLogo.classList.remove('active');
            boxTitle.classList.remove('active');
            boxLink.classList.remove('active');

            // Update content after fade out
            setTimeout(() => {
                boxLogo.textContent = logo;
                boxTitle.textContent = title;
                boxLink.href = link;

                // Fade in new content
                setTimeout(() => {
                    boxLogo.classList.add('active');
                    boxTitle.classList.add('active');
                    boxLink.classList.add('active');
                }, 50);
            }, 300);
        }

        function goToSlide(index) {
            // Clear existing interval
            clearInterval(slideInterval);

            // Update images
            imageElements.forEach((img, i) => {
                img.classList.remove('active');
                if (i === index) {
                    img.classList.add('active');
                }
            });

            // Load slide data into box
            loadSlideData(index);

            // Update progress bars
            const progressBars = document.querySelectorAll('.progress-bar');
            progressBars.forEach((bar, i) => {
                bar.classList.remove('animating', 'completed');
                if (i < index) {
                    bar.classList.add('completed');
                }
            });

            // Animate current progress bar
            setTimeout(() => {
                progressBars[index].classList.add('animating');
            }, 100);

            // Update current slide
            currentSlide = index;

            // Start auto-play
            startAutoPlay();
        }

        function nextSlide() {
            const nextIndex = (currentSlide + 1) % slideItems.length;
            goToSlide(nextIndex);
        }

        function startAutoPlay() {
            slideInterval = setTimeout(() => {
                nextSlide();
            }, 3000);
        }

        // Initialize on load
        initSlider();
    </script>
</body>
</html>
